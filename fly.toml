app = "valetora-CHANGE-ME"      # must be globally unique
primary_region = "iad"

[build]

[env]
  PORT = "8787"
  VALETORA_DATA = "/data/valetora.json"
  VALETORA_RECONCILE_MINUTES = "10"

[mounts]
  source = "valetora_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
